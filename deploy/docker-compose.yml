
x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:${FLAGSMITH_PORT:-8000}
  DJANGO_SECRET_KEY: dev-secret-key-change-in-production
  WAREHOUSE_CREDENTIALS_SECRET: dev-warehouse-secret-change-in-production
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'true'
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  shared:        # bootstrap writes requiem.env here; shop and requiem read it
  incidents:
  pgdata:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    container_name: ${POSTGRES_CONTAINER_NAME:-flagsmith_postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s
    networks:
      - requiem

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - requiem

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    command:
      - serve
    environment:
      <<: *flagsmith-env
    ports:
      - "${FLAGSMITH_PORT:-8000}:8000"
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    networks:
      - requiem

  flagsmith-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    command:
      - run-task-processor
    environment:
      <<: *flagsmith-env
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    networks:
      - requiem

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: [--config=/etc/otel-collector-config.yml]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - prometheus
    networks:
      - requiem

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - requiem

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'      # local demo only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3030}:3000"  # 3030, because host 3000 is often taken
    depends_on:
      - prometheus
    networks:
      - requiem

  # ---- one-command quickstart: everything below needs no host setup ----------------------------

  bootstrap:
    # Creates the admin user, org, project, environment and the two experiments, then exits.
    build: {context: .., dockerfile: deploy/requiem.Dockerfile}
    command: [python, deploy/bootstrap.py]
    restart: "no"
    environment:
      FLAGSMITH_URL: http://flagsmith:8000
      FLAGSMITH_DOMAIN: localhost:${FLAGSMITH_PORT:-8000}
    volumes:
      - shared:/shared
    depends_on:
      - flagsmith
    networks:
      - requiem

  shop:
    build: {context: .., dockerfile: deploy/shop.Dockerfile}
    restart: unless-stopped
    environment:
      FLAGSMITH_URL: http://flagsmith:8000
      OTLP_TRACES_URL: http://otel-collector:4318/v1/traces
    volumes:
      - shared:/shared:ro
    ports:
      - "${SHOP_PORT:-8090}:8090"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - requiem

  requiem:
    build: {context: .., dockerfile: deploy/requiem.Dockerfile}
    restart: unless-stopped
    entrypoint: [deploy/with-env.sh]
    command: [python, -m, requiem.service, run]
    environment:
      FLAGSMITH_URL: http://flagsmith:8000
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
    volumes:
      - shared:/shared:ro
      - incidents:/app/incidents
      - ../requiem.yaml:/app/requiem.yaml:ro   # edit the contracts, then `docker compose restart requiem`
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    networks:
      - requiem

  loadgen:
    # Opt-in traffic: `docker compose --profile loadgen up -d loadgen`. 30 simulated shoppers.
    profiles: [loadgen]
    build: {context: .., dockerfile: deploy/requiem.Dockerfile}
    restart: unless-stopped
    command: [python, loadgen/run.py, run, --seconds, "0"]
    environment:
      SHOP_URL: http://shop:8090
    depends_on:
      shop:
        condition: service_healthy
    networks:
      - requiem

networks:
  requiem:
    driver: bridge
