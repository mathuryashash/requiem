
x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: dev-secret-key-change-in-production
  WAREHOUSE_CREDENTIALS_SECRET: dev-warehouse-secret-change-in-production
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'true'
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    container_name: flagsmith_postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s
    networks:
      - requiem

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - requiem

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    command:
      - serve
    environment:
      <<: *flagsmith-env
    ports:
      - "8000:8000"
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    networks:
      - requiem

  flagsmith-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    command:
      - run-task-processor
    environment:
      <<: *flagsmith-env
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    networks:
      - requiem

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: [--config=/etc/otel-collector-config.yml]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - prometheus
    networks:
      - requiem

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - requiem

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'      # local demo only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    ports:
      - "3030:3000"  # host 3000 is the Hermes WhatsApp bridge
    depends_on:
      - prometheus
    networks:
      - requiem

networks:
  requiem:
    driver: bridge
