# Requiem contracts: what each experiment flag must keep doing, and what happens if it doesn't.
check_every_seconds: 5

flags:
  new_checkout:
    experiment: New checkout
    max_error_rate: 0.05     # the new checkout may fail at most 5% of requests
    min_gap: 0.02            # and must be at least 2 points worse than control to count
    min_requests: 20         # per window, before we judge at all
    window_seconds: 30
    breach_windows: 3        # consecutive breached checks before acting
    on_breach: kill          # or "ask": write the incident note and wait for a human
  buy_button:
    experiment: Green buy button
    max_error_rate: 0.05
    min_gap: 0.02
    min_requests: 20
    window_seconds: 30
    breach_windows: 3
    on_breach: kill
    retire:                  # RETIRE: what decides it, and where the losing code lives
      metric: purchase
      win_probability: 0.95  # chance_to_win needed to call a winner (Flagsmith's own bar)
      code: shop/app.py      # the codemod deletes the losing branch here
      traffic: "load-generated by loadgen/run.py; the script chooses who buys (green 45%, control 20%), so the lift is script-made"
